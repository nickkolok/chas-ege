# .github/workflows/ci.yml
name: CI Build

on:
  push:
    branches: [ devel, main, master ]
  pull_request:
    branches: [ devel, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js v22.12.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.12.0'

    - name: Install dependencies
      run: npm install    
      
    - name: Ensure grunt-cli is available
      # Legacy Grunt 0.4.x often requires explicit CLI installation to work reliably on modern Node
      run: npm install grunt-cli --save-dev

    - name: Run default Grunt build
      run: ./node_modules/.bin/grunt

    - name: Upload built libraries as artifact
      uses: actions/upload-artifact@v4
      with:
        name: lib-bundle
        path: |
          build/lib/chas-uijs.js
          build/lib/chas-lib.js
        if-no-files-found: error

    - name: Check task sets
      run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

    - name: Run Node.js unit tests
      run: node dev/run-node-tests.js

    - name: Check task sets
      run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

  publish-devel-bundle:
    # Rolling-релиз с собранными библиотеками: только push в devel,
    # только после успешных сборки и тестов (needs: build).
    if: github.event_name == 'push' && github.ref == 'refs/heads/devel'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-devel-bundle
      cancel-in-progress: false

    steps:
    - name: Download built libraries
      uses: actions/download-artifact@v4
      with:
        name: lib-bundle
        path: build/lib

    - name: Publish rolling release devel-bundle-latest
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: devel-bundle-latest
      run: |
        set -euo pipefail
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false --title "devel bundle" \
            --notes "Rolling-сборка build/lib из ветки devel."
        # Тег — движущийся указатель: всегда на коммите, чья сборка опубликована.
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
          -f sha="$GITHUB_SHA" -F force=true
        gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
          build/lib/chas-uijs.js build/lib/chas-lib.js --clobber
        gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
          --title "devel bundle @ ${GITHUB_SHA:0:9}" \
          --notes "Автосборка build/lib (chas-uijs.js, chas-lib.js) из devel @ ${GITHUB_SHA}. Не минифицировано. Тег rolling: прямые ссылки всегда на свежую сборку; точный коммит — здесь и в заголовке."
