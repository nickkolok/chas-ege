# .github/workflows/ci.yml
name: CI Build

on:
  push:
    branches: [ devel, main, master ]
  pull_request:
    branches: [ devel, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Ensure grunt-cli is available
        # Legacy Grunt 0.4.x often requires explicit CLI installation to work reliably on modern Node
        run: npm install grunt-cli --save-dev

      - name: Run default Grunt build
        run: ./node_modules/.bin/grunt

      - name: Check task sets
        run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

      - name: Run Node.js unit tests
        run: node dev/run-node-tests.js

      - name: Check task sets
        run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

  lint-zdn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch diff base (shallow, 1 commit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            # Первый пуш в ветку — before состоит из нулей
            if echo "$BEFORE" | grep -qE '^0+$'; then
              echo "Initial push — will check all files."
              echo "LINT_ALL=1" >> "$GITHUB_ENV"
            else
              git fetch --depth=1 origin "$BEFORE"
            fi
          fi

      # ── Шаг 1: shell-скрипт (быстрый, без зависимостей) ──────────────────
      - name: Shell lint — zdn/
        run: |
          if [ "${LINT_ALL:-0}" = "1" ]; then
            ./dev/lint-zdn.sh --all
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ./dev/lint-zdn.sh "${{ github.event.pull_request.base.sha }}"
          else
            ./dev/lint-zdn.sh "${{ github.event.before }}"
          fi

      # ── Шаг 2: ESLint (синтаксис, дубли ключей, smart-tabs и т.д.) ───────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install ESLint
        # Ставим только eslint + formatter, не весь npm install —
        # иначе потащим grunt и прочее, что для линта не нужно.
        # --no-save: не модифицируем package.json / lockfile на раннере.
        run: npm install --no-save eslint@8 eslint-formatter-github-actions

      - name: ESLint — zdn/
        run: |
          # Собираем список изменённых .js-файлов в zdn/
          if [ "${LINT_ALL:-0}" = "1" ]; then
            FILES=$(find zdn/ -type f -name '*.js' | sort)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" HEAD -- 'zdn/*.js')
          else
            FILES=$(git diff --name-only --diff-filter=ACMR \
              "${{ github.event.before }}" HEAD -- 'zdn/*.js')
          fi

          # Если изменённых .js нет — пропускаем
          if [ -z "$FILES" ]; then
            echo "No changed .js files in zdn/ — skipping ESLint."
            exit 0
          fi

          echo "$FILES" | xargs npx eslint \
            --rulesdir dev/eslint_rules \
            --config dev/eslintrc.zdn.json \
            --no-eslintrc \
            --format github-actions
