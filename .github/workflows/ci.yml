# .github/workflows/ci.yml
name: CI Build

on:
  push:
    branches: [ devel, main, master ]
  pull_request:
    branches: [ devel, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js v22.7.0
      uses: actions/setup-node@v4
      with:
        node-version: '22.7.0'
        cache: 'npm'  # ✅ Caches node_modules for faster subsequent runs

    - name: Install dependencies
      run: npm install

    - name: Run default Grunt build
      run: npx grunt --force

    - name: Run specific task: process-task-sets packTasks process-task-sets
      run: npx grunt process-task-sets packTasks process-task-sets --force
