# .github/workflows/ci.yml
name: CI Build

on:
  push:
    branches: [ devel, main, master ]
  pull_request:
    branches: [ devel, main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Ensure grunt-cli is available
        # Legacy Grunt 0.4.x often requires explicit CLI installation to work reliably on modern Node
        run: npm install grunt-cli --save-dev

      - name: Run default Grunt build
        run: ./node_modules/.bin/grunt

      - name: Check task sets
        run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

      - name: Run Node.js unit tests
        run: node dev/run-node-tests.js

      - name: Check task sets
        run: ./node_modules/.bin/grunt process-task-sets packTasks process-task-sets

  lint-zdn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch diff base (shallow, 1 commit)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            # Первый пуш в ветку — before состоит из нулей
            if echo "$BEFORE" | grep -qE '^0+$'; then
              echo "Initial push — will check all files."
              echo "LINT_ALL=1" >> "$GITHUB_ENV"
            else
              git fetch --depth=1 origin "$BEFORE"
            fi
          fi

      - name: Lint changed files in zdn/
        run: |
          if [ "${LINT_ALL:-0}" = "1" ]; then
            ./dev/lint-zdn.sh --all
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ./dev/lint-zdn.sh "${{ github.event.pull_request.base.sha }}"
          else
            ./dev/lint-zdn.sh "${{ github.event.before }}"
          fi
