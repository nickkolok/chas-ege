<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Random Grid Road Visualization</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            font-family: Arial, sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 1px;
            background-color: #333;
            border-radius: 10px;
            border: 2px solid #444;
        }

        .cell {
            width: 20px;
            height: 20px;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #fff;
        }

        .road {
            background-color: #4CAF50;
        }

        .turn {
            background-color: #2196F3;
        }

        .boundary {
            border: 1px solid #ff6b6b;
        }

        #regenerateButton {
            position: fixed;
            top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #regenerateButton:hover {
            background-color: #45a049;
        }

        #turnCounter {
            position: fixed;
            top: 60px;
            color: white;
        }

        #pathLength {
            position: fixed;
            top: 90px;
            color: white;
        }
    </style>
</head>
<body>
    <button id="regenerateButton">Создать новую дорогу</button>
    <div id="turnCounter">Количество поворотов: 0</div>
    <div id="pathLength">Длина пути: 0</div>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        const gridSize = 20;
        const MIN_STRAIGHT_PATH = 3;
        const MAX_TURNS = 3;
        const MIN_PATH_LENGTH = 10;
        
        function createGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const cellNumber = i * gridSize + j + 1;
                    cell.textContent = cellNumber;
                    cell.dataset.x = i;
                    cell.dataset.y = j;
                    if (i === 0 || i === gridSize-1 || j === 0 || j === gridSize-1) {
                        cell.classList.add('boundary');
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function isValidPosition(x, y, isFirstCell = false) {
            if (isFirstCell) {
                return y === 0 && x > 0 && x < gridSize - 1;
            }
            return x > 1 && x < gridSize - 2 && y > 0 && y < gridSize - 1;
        }

        function generateRandomRoad() {
            const startX = Math.floor(Math.random() * (gridSize - 4)) + 2;
            let currentX = startX;
            let currentY = 0;
            const roadPath = [{x: currentX, y: currentY}];
            
            let straightSteps = 0;
            let lastDirection = 'down';
            let turnsCount = 0;
            
            // Функция для проверки минимальной длины пути
            function canReachMinLength(currentLength, remainingSteps) {
                return currentLength + remainingSteps >= MIN_PATH_LENGTH;
            }
            
            while (currentY < gridSize - 2) {
                const directions = [];
                
                // Проверяем возможность достижения минимальной длины
                const currentLength = roadPath.length;
                const minRemainingSteps = gridSize - 1 - currentY;
                
                if (!canReachMinLength(currentLength, minRemainingSteps)) {
                    return generateRandomRoad();
                }
                
                if (currentY < gridSize - 2) {
                    if (lastDirection === 'down' || (straightSteps >= MIN_STRAIGHT_PATH && turnsCount < MAX_TURNS)) {
                        directions.push('down');
                    }
                }
                
                if (currentX < gridSize - 3) {
                    if (lastDirection === 'right' || (straightSteps >= MIN_STRAIGHT_PATH && turnsCount < MAX_TURNS)) {
                        directions.push('right');
                    }
                }
                
                if (currentX > 2) {
                    if (lastDirection === 'left' || (straightSteps >= MIN_STRAIGHT_PATH && turnsCount < MAX_TURNS)) {
                        directions.push('left');
                    }
                }
                
                if (turnsCount >= MAX_TURNS) {
                    directions.length = 0;
                    if (currentY < gridSize - 2) {
                        directions.push('down');
                    }
                }
                
                if (directions.length === 0) {
                    return generateRandomRoad();
                }
                
                const direction = directions[Math.floor(Math.random() * directions.length)];
                
                if (direction === lastDirection) {
                    straightSteps++;
                } else {
                    straightSteps = 1;
                    turnsCount++;
                }
                
                switch(direction) {
                    case 'down':
                        currentY++;
                        break;
                    case 'right':
                        currentX++;
                        break;
                    case 'left':
                        currentX--;
                        break;
                }
                
                if (!isValidPosition(currentX, currentY)) {
                    continue;
                }
                
                lastDirection = direction;
                roadPath.push({x: currentX, y: currentY});
            }
            
            // Проверяем минимальную длину пути
            if (roadPath.length < MIN_PATH_LENGTH) {
                return generateRandomRoad();
            }
            
            return { roadPath, turnsCount };
        }

        function drawRoad() {
            createGrid();
            const { roadPath, turnsCount } = generateRandomRoad();
            
            document.getElementById('turnCounter').textContent = `Количество поворотов: ${turnsCount}`;
            document.getElementById('pathLength').textContent = `Длина пути: ${roadPath.length}`;
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const x = parseInt(cell.dataset.x);
                const y = parseInt(cell.dataset.y);
                
                if (roadPath.some(point => point.x === x && point.y === y)) {
                    cell.classList.add('road');
                    
                    const index = roadPath.findIndex(point => point.x === x && point.y === y);
                    if (index > 0 && index < roadPath.length - 1) {
                        const prev = roadPath[index - 1];
                        const next = roadPath[index + 1];
                        if (prev.x !== next.x && prev.y !== next.y) {
                            cell.classList.add('turn');
                        }
                    }
                }
            });
        }

        document.getElementById('regenerateButton').addEventListener('click', drawRoad);
        drawRoad();
    </script>
</body>
</html>
