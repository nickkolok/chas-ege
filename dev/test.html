<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Random Grid Road Visualization</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e1e1e, #2d2d2d);
            font-family: Arial, sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 1px;
            background-color: #333;
            border-radius: 10px;
            border: 2px solid #444;
        }

        .cell {
            width: 20px;
            height: 20px;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #fff;
        }

        .road {
            background-color: #4CAF50;
        }

        .turn {
            background-color: #2196F3;
        }

        #regenerateButton {
            position: fixed;
            top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #regenerateButton:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <button id="regenerateButton">Создать новую дорогу</button>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        const gridSize = 20;
        
        function createGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = `${i},${j}`;
                    grid.appendChild(cell);
                }
            }
        }

        function generateRandomRoad() {
            // Начальная точка всегда сверху, случайная позиция по X
            const startX = Math.floor(Math.random() * (gridSize - 2)) + 1;
            let currentX = startX;
            let currentY = 0;
            const roadPath = [{x: currentX, y: currentY}];
            
            // Генерируем путь до нижней границы
            while (currentY < gridSize - 1) {
                // Определяем возможные направления движения
                const directions = [];
                
                // Вниз всегда возможно, если мы не у нижней границы
                if (currentY < gridSize - 1) directions.push('down');
                
                // Вправо возможно, если есть место и нет поворота в предыдущих 2 шагах
                if (currentX < gridSize - 2 && 
                    roadPath.slice(-2).every(point => point.x === currentX)) {
                    directions.push('right');
                }
                
                // Влево возможно, если есть место и нет поворота в предыдущих 2 шагах
                if (currentX > 1 && 
                    roadPath.slice(-2).every(point => point.x === currentX)) {
                    directions.push('left');
                }
                
                // Выбираем случайное направление
                const direction = directions[Math.floor(Math.random() * directions.length)];
                
                switch(direction) {
                    case 'down':
                        currentY++;
                        break;
                    case 'right':
                        currentX++;
                        break;
                    case 'left':
                        currentX--;
                        break;
                }
                
                roadPath.push({x: currentX, y: currentY});
            }
            
            return roadPath;
        }

        function drawRoad() {
            createGrid();
            const roadPath = generateRandomRoad();
            
            // Применяем стили дороги
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const [x, y] = cell.textContent.split(',').map(Number);
                
                if (roadPath.some(point => point.x === x && point.y === y)) {
                    cell.classList.add('road');
                    
                    // Определяем повороты
                    const index = roadPath.findIndex(point => point.x === x && point.y === y);
                    if (index > 0 && index < roadPath.length - 1) {
                        const prev = roadPath[index - 1];
                        const next = roadPath[index + 1];
                        if (prev.x !== next.x && prev.y !== next.y) {
                            cell.classList.add('turn');
                        }
                    }
                }
            });
        }

        // Инициализация и обработчик кнопки
        document.getElementById('regenerateButton').addEventListener('click', drawRoad);
        drawRoad();
    </script>
</body>
</html>
